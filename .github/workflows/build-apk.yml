name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
      - name: Build Professional APK with Secret Key
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --dart-define=GROQ_API_KEY=$GROQ_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-girl-pro-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
