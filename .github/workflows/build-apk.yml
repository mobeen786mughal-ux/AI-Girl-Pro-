name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true
      - name: FULL AUTO - Professional 4D - FIXED
        run: |
          flutter create . --org com.aigirl.pro --project-name ai_girl_pro
          git checkout HEAD -- assets/ || true
          mkdir -p lib
          cat > pubspec.yaml << 'EOF'
          name: ai_girl_pro
          description: Real AI Girl - Groq AI + Emotion + Voice - Professional 4D FIXED
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.5.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            model_viewer_plus: ^1.5.2
            http: ^1.2.0
            flutter_tts: ^4.2.3
            speech_to_text: ^7.2.0
            flutter_launcher_icons: ^0.14.3
          flutter:
            uses-material-design: true
            assets:
              - assets/models/Anime-Girl.glb
              - assets/icons/app-icon.jpg
          flutter_icons:
            android: true
            ios: true
            image_path: "assets/icons/app-icon.jpg"
            min_sdk_android: 21
          EOF
          cat > lib/main.dart << 'DART_EOF'
          import 'dart:convert';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:model_viewer_plus/model_viewer_plus.dart';
          import 'package:http/http.dart' as http;
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          void main() => runApp(const AIGirlPro());
          class AIGirlPro extends StatelessWidget {
            const AIGirlPro({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, title: 'AI Girl Pro', theme: ThemeData.dark().copyWith(scaffoldBackgroundColor: Colors.black), home: const HomeScreen());
            }
          }
          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> with TickerProviderStateMixin {
            final TextEditingController _ctrl = TextEditingController();
            final FlutterTts _tts = FlutterTts();
            final stt.SpeechToText _speech = stt.SpeechToText();
            String _msg = "Hi Jaan! Main Tumhari AI Girl Hun! ❤️";
            String _emotion = "happy";
            bool _isListening = false;
            bool _isThinking = false;
            double _girlScale = 1.0;
            double _girlRotate = 0.0;
            double _girlBounce = 8.0;
            List<Map<String, String>> _history = [];
            final String groqKey = String.fromEnvironment("GROQ_API_KEY", defaultValue: "PASTE_YOUR_GROQ_KEY_HERE");
            late AnimationController _bgCtrl;
            late AnimationController _bounceCtrl;
            @override
            void initState() {
              super.initState();
              _bgCtrl = AnimationController(vsync: this, duration: const Duration(seconds: 8))..repeat(reverse: true);
              _bounceCtrl = AnimationController(vsync: this, duration: const Duration(milliseconds: 800))..repeat(reverse: true);
            }
            @override
            void dispose() { _bgCtrl.dispose(); _bounceCtrl.dispose(); super.dispose(); }
            String getEmoji() {
              if (_emotion == "love") return "😍";
              if (_emotion == "sad") return "😔";
              if (_emotion == "angry") return "😡";
              if (_emotion == "laugh") return "😂";
              if (_emotion == "shy") return "🙈";
              if (_emotion == "dance") return "💃";
              return "😊";
            }
            String detectEmotion(String text) {
              String t = text.toLowerCase();
              if (t.contains("love") || t.contains("pyar") || t.contains("jaan")) return "love";
              if (t.contains("sad") || t.contains("udas")) return "sad";
              if (t.contains("gussa") || t.contains("angry")) return "angry";
              if (t.contains("haha") || t.contains("funny") || t.contains("haso")) return "laugh";
              if (t.contains("sharm")) return "shy";
              if (t.contains("dance") || t.contains("nach")) return "dance";
              return "happy";
            }
            void play4DAnimation(String fullMessage) {
              String m = fullMessage.toLowerCase();
              setState(() {
                if (m.contains("dance") || m.contains("nach") || m.contains("gana")) { _girlScale = 1.15; _girlRotate = 0.3; _girlBounce = 20; }
                else if (m.contains("love") || m.contains("pyar") || m.contains("jaan") || m.contains("hug") || m.contains("kiss")) { _girlScale = 1.25; _girlRotate = 0.0; _girlBounce = 12; }
                else if (m.contains("sad") || m.contains("udas") || m.contains("cry")) { _girlScale = 0.9; _girlRotate = -0.1; _girlBounce = 0; }
                else if (m.contains("haha") || m.contains("funny") || m.contains("haso")) { _girlScale = 1.1; _girlRotate = 0.15; _girlBounce = 18; }
                else if (m.contains("gussa") || m.contains("angry")) { _girlScale = 1.05; _girlRotate = -0.2; _girlBounce = 0; }
                else { _girlScale = 1.0; _girlRotate = 0.0; _girlBounce = 8; }
              });
              Future.delayed(const Duration(seconds: 2), () { if (mounted) setState(() { _girlScale = 1.0; _girlRotate = 0.0; _girlBounce = 8; }); });
            }
            Future<void> speak(String text) async {
              await _tts.setLanguage("ur-PK");
              await _tts.setPitch(1.3);
              await _tts.setSpeechRate(0.9);
              await _tts.speak(text);
            }
            Future<void> askGroq(String userText) async {
              setState(() { _isThinking = true; _msg = "Soch rahi hun Jaan... 🤔"; });
              try {
                final res = await http.post(Uri.parse("https://api.groq.com/openai/v1/chat/completions"), headers: {"Authorization": "Bearer $groqKey", "Content-Type": "application/json"}, body: jsonEncode({"model": "llama-3.3-70b-versatile","messages": [{"role": "system", "content": "Tum ek pyari AI Girl ho. Roman Urdu + English mix me baat karo. Short, pyare, emotional jawab do."}, ..._history.map((m) => {"role": m["role"], "content": m["text"]}), {"role": "user", "content": userText}],"temperature": 0.8, "max_tokens": 200}));
                if (res.statusCode == 200) {
                  String reply = jsonDecode(res.body)["choices"][0]["message"]["content"];
                  _history.add({"role": "user", "text": userText});
                  _history.add({"role": "assistant", "text": reply});
                  String emo = detectEmotion(reply + " " + userText);
                  setState(() { _msg = reply; _emotion = emo; _isThinking = false; });
                  play4DAnimation(reply + " " + userText);
                  speak(reply);
                } else { setState(() { _msg = "Jaan, thoda issue hai, phir se bolo na! 🥺"; _isThinking = false; }); }
              } catch (e) { setState(() { _msg = "Internet check karo Jaan! 📶"; _isThinking = false; }); }
            }
            Future<void> listen() async {
              bool avail = await _speech.initialize();
              if (avail) { setState(() => _isListening = true); _speech.listen(onResult: (r) { if (r.finalResult) { setState(() => _isListening = false); askGroq(r.recognizedWords); } }); }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: AnimatedBuilder(
                  animation: _bgCtrl,
                  builder: (context, child) {
                    return Container(
                      decoration: BoxDecoration(gradient: LinearGradient(begin: Alignment.topLeft, end: Alignment.bottomRight, colors: [Color.lerp(Colors.pink.shade900, Colors.purple.shade900, _bgCtrl.value)!, Color.lerp(Colors.black, Colors.pink.shade900, _bgCtrl.value)!])),
                      child: SafeArea(child: Column(children: [
                        Container(padding: const EdgeInsets.all(12), margin: const EdgeInsets.all(10), decoration: BoxDecoration(color: Colors.white.withOpacity(0.12), borderRadius: BorderRadius.circular(20), border: Border.all(color: Colors.pink.withOpacity(0.4))), child: Row(children: [Container(decoration: BoxDecoration(shape: BoxShape.circle, boxShadow: [BoxShadow(color: Colors.pink.withOpacity(0.8), blurRadius: 15)]), child: const CircleAvatar(radius: 24, backgroundImage: AssetImage("assets/icons/app-icon.jpg"))), const SizedBox(width: 10), Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Text("AI Girl Pro ✨", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 18)), Text("Online • ${getEmoji()} $_emotion  •  4D Live", style: const TextStyle(fontSize: 12, color: Colors.pinkAccent))]), const Spacer(), Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4), decoration: BoxDecoration(color: Colors.green, borderRadius: BorderRadius.circular(20)), child: const Text("LIVE", style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold)))])),
                        Expanded(flex: 3, child: Stack(children: [
                          AnimatedBuilder(animation: _bounceCtrl, builder: (context, child) { return Transform.translate(offset: Offset(0, math.sin(_bounceCtrl.value * math.pi) * _girlBounce * 0.3), child: child); }, child: AnimatedContainer(duration: const Duration(milliseconds: 700), curve: Curves.elasticOut, transform: Matrix4.identity()..scale(_girlScale)..rotateZ(_girlRotate), child: Container(decoration: BoxDecoration(borderRadius: BorderRadius.circular(25), boxShadow: [BoxShadow(color: Colors.pink.withOpacity(0.4), blurRadius: 30, spreadRadius: 5)]), margin: const EdgeInsets.all(10), child: ClipRRect(borderRadius: BorderRadius.circular(25), child: ModelViewer(src: "assets/models/Anime-Girl.glb", alt: "AI Girl", autoRotate: true, cameraControls: true, autoPlay: true))))),
                          Positioned(top: 12, left: 12, right: 12, child: AnimatedOpacity(opacity: 1.0, duration: const Duration(milliseconds: 500), child: Container(padding: const EdgeInsets.all(14), decoration: BoxDecoration(color: Colors.black.withOpacity(0.65), borderRadius: BorderRadius.circular(18), border: Border.all(color: Colors.pink.withOpacity(0.5))), child: Row(children: [Text(getEmoji(), style: const TextStyle(fontSize: 22)), const SizedBox(width: 8), Expanded(child: Text(_msg, style: const TextStyle(color: Colors.white, fontSize: 15, fontWeight: FontWeight.w500)))])))),
                          if (_isThinking) const Positioned(bottom: 12, right: 12, child: CircularProgressIndicator(color: Colors.pink)),
                          if (_emotion == "love") const Positioned(top: 90, right: 20, child: Text("❤️", style: TextStyle(fontSize: 30))),
                          if (_emotion == "love") const Positioned(top: 110, left: 25, child: Text("💖", style: TextStyle(fontSize: 24))),
                        ])),
                        Container(padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6), child: Wrap(spacing: 8, runSpacing: 6, alignment: WrapAlignment.center, children: [for (var b in ["Hi Jaan! ❤️", "Baat Karo 💬", "Dance Karo 💃", "I Love You 😍", "Sad Hun 😔"]) ElevatedButton(onPressed: () => askGroq(b), style: ElevatedButton.styleFrom(backgroundColor: Colors.pink, foregroundColor: Colors.white, shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(25)), elevation: 8, shadowColor: Colors.pink), child: Text(b))])),
                        Container(margin: const EdgeInsets.all(10), padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4), decoration: BoxDecoration(color: Colors.white.withOpacity(0.12), borderRadius: BorderRadius.circular(30), border: Border.all(color: Colors.pink.withOpacity(0.4))), child: Row(children: [IconButton(onPressed: listen, icon: Icon(_isListening ? Icons.mic : Icons.mic_none, color: Colors.pink, size: 30)), Expanded(child: TextField(controller: _ctrl, style: const TextStyle(color: Colors.white), decoration: const InputDecoration(hintText: "Kuch likho Jaan... 💌", hintStyle: TextStyle(color: Colors.white54), border: InputBorder.none))), IconButton(onPressed: () { if (_ctrl.text.isNotEmpty) { askGroq(_ctrl.text); _ctrl.clear(); } }, icon: const Icon(Icons.send, color: Colors.pink, size: 30))])),
                      ])),
                    );
                  },
                ),
              );
            }
          }
          DART_EOF
          sed -i "s/id \"org.jetbrains.kotlin.android\" version \".*\"/id \"org.jetbrains.kotlin.android\" version \"2.1.0\"/" android/settings.gradle || true
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" $MANIFEST || sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' $MANIFEST
          grep -q "usesCleartextTraffic" $MANIFEST || sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $MANIFEST
          cat $MANIFEST
          flutter clean
          flutter pub get
          flutter analyze --no-pub || true
          dart run flutter_launcher_icons || echo "Icon skip"
      - name: Build APK - Professional 4D FIXED
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "Key length: ${#GROQ_KEY}"
          if [ -z "$GROQ_KEY" ]; then echo "ERROR: GROQ_API_KEY Secret Khali Hai!"; exit 1; fi
          flutter build apk --release --dart-define=GROQ_API_KEY=$GROQ_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-girl-pro-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
