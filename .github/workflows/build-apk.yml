name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true
      - name: FULL AUTO - Message ke Hisaab se Movement
        run: |
          flutter create . --org com.aigirl.pro --project-name ai_girl_pro
          git checkout HEAD -- assets/ || true
          mkdir -p lib
          cat > pubspec.yaml << 'EOF'
          name: ai_girl_pro
          description: Real AI Girl - Groq AI + Emotion + Voice - OFFLINE MODEL
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.5.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            flutter_3d_controller: ^2.0.0
            http: ^1.2.0
            flutter_tts: ^4.2.3
            speech_to_text: ^7.2.0
            flutter_launcher_icons: ^0.14.3
          flutter:
            uses-material-design: true
            assets:
              - assets/models/Anime-Girl.glb
              - assets/icons/app-icon.jpg
          flutter_icons:
            android: true
            ios: true
            image_path: "assets/icons/app-icon.jpg"
            min_sdk_android: 21
          EOF
          cat > lib/main.dart << 'DART_EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter_3d_controller/flutter_3d_controller.dart';
          import 'package:http/http.dart' as http;
          import 'package:flutter_tts/flutter_tts.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          void main() => runApp(const AIGirlPro());
          class AIGirlPro extends StatelessWidget {
            const AIGirlPro({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, title: 'AI Girl Pro', theme: ThemeData.dark().copyWith(scaffoldBackgroundColor: Colors.black), home: const HomeScreen());
            }
          }
          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          class _HomeScreenState extends State<HomeScreen> {
            final TextEditingController _ctrl = TextEditingController();
            final FlutterTts _tts = FlutterTts();
            final stt.SpeechToText _speech = stt.SpeechToText();
            Flutter3DController girlController = Flutter3DController();
            String _msg = "Hi Jaan! Main Tumhari AI Girl Hun! ❤️";
            String _emotion = "happy";
            bool _isListening = false;
            bool _isThinking = false;
            List<Map<String, String>> _history = [];
            final String groqKey = String.fromEnvironment("GROQ_API_KEY", defaultValue: "PASTE_YOUR_GROQ_KEY_HERE");
            String getEmoji() {
              if (_emotion == "love") return "😍";
              if (_emotion == "sad") return "😔";
              if (_emotion == "angry") return "😡";
              if (_emotion == "laugh") return "😂";
              if (_emotion == "shy") return "🙈";
              if (_emotion == "dance") return "💃";
              return "😊";
            }
            String detectEmotion(String text) {
              String t = text.toLowerCase();
              if (t.contains("love") || t.contains("pyar") || t.contains("jaan")) return "love";
              if (t.contains("sad") || t.contains("udas")) return "sad";
              if (t.contains("gussa") || t.contains("angry")) return "angry";
              if (t.contains("haha") || t.contains("funny") || t.contains("haso")) return "laugh";
              if (t.contains("sharm")) return "shy";
              if (t.contains("dance") || t.contains("nach")) return "dance";
              return "happy";
            }
            Future<void> playEmotionAnimation(String fullMessage) async {
              String m = fullMessage.toLowerCase();
              try {
                if (m.contains("dance") || m.contains("nach") || m.contains("gana") || m.contains("naach")) {
                  await girlController.playAnimation(animationName: "dance");
                  await girlController.setCameraOrbit(30, 75, 95);
                } else if (m.contains("love") || m.contains("pyar") || m.contains("jaan") || m.contains("i love") || m.contains("hug") || m.contains("kiss")) {
                  await girlController.playAnimation(animationName: "idle");
                  await girlController.setCameraOrbit(10, 80, 85);
                } else if (m.contains("sad") || m.contains("udas") || m.contains("ro ") || m.contains("cry") || m.contains("dil toot")) {
                  await girlController.playAnimation(animationName: "idle");
                  await girlController.setCameraOrbit(-20, 70, 110);
                } else if (m.contains("haha") || m.contains("funny") || m.contains("haso") || m.contains("mazak")) {
                  await girlController.playAnimation(animationName: "laugh");
                  await girlController.setCameraOrbit(0, 80, 90);
                } else if (m.contains("gussa") || m.contains("angry") || m.contains("naraz")) {
                  await girlController.playAnimation(animationName: "idle");
                  await girlController.setCameraOrbit(-10, 75, 100);
                } else if (m.contains("sharm") || m.contains("shy")) {
                  await girlController.playAnimation(animationName: "idle");
                  await girlController.setCameraOrbit(15, 85, 105);
                } else if (m.contains("bye") || m.contains("allah hafiz")) {
                  await girlController.playAnimation(animationName: "idle");
                  await girlController.setCameraOrbit(25, 75, 105);
                } else {
                  await girlController.playAnimation(animationName: "idle");
                  await girlController.setCameraOrbit(20, 75, 100);
                }
              } catch (e) {
                try { await girlController.setCameraOrbit(20, 75, 100); } catch (_) {}
              }
            }
            Future<void> speak(String text) async {
              await _tts.setLanguage("ur-PK");
              await _tts.setPitch(1.3);
              await _tts.setSpeechRate(0.9);
              await _tts.speak(text);
            }
            Future<void> askGroq(String userText) async {
              setState(() { _isThinking = true; _msg = "Soch rahi hun Jaan... 🤔"; });
              try {
                final res = await http.post(Uri.parse("https://api.groq.com/openai/v1/chat/completions"), headers: {"Authorization": "Bearer $groqKey", "Content-Type": "application/json"}, body: jsonEncode({"model": "llama-3.3-70b-versatile","messages": [{"role": "system", "content": "Tum ek pyari AI Girl ho. Roman Urdu + English mix me baat karo. Short, pyare, emotional jawab do."}, ..._history.map((m) => {"role": m["role"], "content": m["text"]}), {"role": "user", "content": userText}],"temperature": 0.8, "max_tokens": 200}));
                if (res.statusCode == 200) {
                  String reply = jsonDecode(res.body)["choices"][0]["message"]["content"];
                  _history.add({"role": "user", "text": userText});
                  _history.add({"role": "assistant", "text": reply});
                  String emo = detectEmotion(reply + " " + userText);
                  setState(() { _msg = reply; _emotion = emo; _isThinking = false; });
                  await playEmotionAnimation(reply + " " + userText);
                  speak(reply);
                } else { setState(() { _msg = "Jaan, thoda issue hai, phir se bolo na! 🥺"; _isThinking = false; }); }
              } catch (e) { setState(() { _msg = "Internet check karo Jaan! 📶"; _isThinking = false; }); }
            }
            Future<void> listen() async {
              bool avail = await _speech.initialize();
              if (avail) { setState(() => _isListening = true); _speech.listen(onResult: (r) { if (r.finalResult) { setState(() => _isListening = false); askGroq(r.recognizedWords); } }); }
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(backgroundColor: Colors.pink, title: Row(children: [const CircleAvatar(backgroundImage: AssetImage("assets/icons/app-icon.jpg")), const SizedBox(width: 10), Column(crossAxisAlignment: CrossAxisAlignment.start, children: [const Text("AI Girl Pro", style: TextStyle(fontWeight: FontWeight.bold)), Text("Online • ${getEmoji()} $_emotion", style: const TextStyle(fontSize: 12))])])),
                body: Column(children: [
                  Expanded(flex: 3, child: Stack(children: [Flutter3D(controller: girlController, src: "assets/models/Anime-Girl.glb"), Positioned(top: 10, left: 10, right: 10, child: Container(padding: const EdgeInsets.all(12), decoration: BoxDecoration(color: Colors.black54, borderRadius: BorderRadius.circular(15)), child: Text(_msg, style: const TextStyle(color: Colors.white, fontSize: 16)))), if (_isThinking) const Positioned(bottom: 10, right: 10, child: CircularProgressIndicator(color: Colors.pink))])),
                  Container(padding: const EdgeInsets.all(8), child: Wrap(spacing: 8, children: [for (var b in ["Hi Jaan! ❤️", "Baat Karo", "Dance Karo 💃", "I Love You", "Sad Hun"]) ElevatedButton(onPressed: () => askGroq(b), style: ElevatedButton.styleFrom(backgroundColor: Colors.pink), child: Text(b, style: const TextStyle(color: Colors.white)))])),
                  Padding(padding: const EdgeInsets.all(10), child: Row(children: [IconButton(onPressed: listen, icon: Icon(_isListening ? Icons.mic : Icons.mic_none, color: Colors.pink, size: 30)), Expanded(child: TextField(controller: _ctrl, decoration: InputDecoration(hintText: "Kuch likho Jaan...", filled: true, fillColor: Colors.white12, border: OutlineInputBorder(borderRadius: BorderRadius.circular(25), borderSide: BorderSide.none)))), IconButton(onPressed: () { if (_ctrl.text.isNotEmpty) { askGroq(_ctrl.text); _ctrl.clear(); } }, icon: const Icon(Icons.send, color: Colors.pink, size: 30))])),
                ]),
              );
            }
          }
          DART_EOF
          sed -i "s/id \"org.jetbrains.kotlin.android\" version \".*\"/id \"org.jetbrains.kotlin.android\" version \"2.1.0\"/" android/settings.gradle || true
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q "INTERNET" $MANIFEST || sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />|' $MANIFEST
          flutter clean
          flutter pub get
          dart run flutter_launcher_icons || echo "Icon skip"
      - name: Build APK - Message Movement
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter build apk --release --dart-define=GROQ_API_KEY=$GROQ_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-girl-pro-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
