name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true
      - name: Auto Fix - Android + Kotlin + Icon
        run: |
          flutter create . --org com.aigirl.pro --project-name ai_girl_pro
          git checkout HEAD -- lib/ pubspec.yaml assets/ || true
          sed -i "s/id \"org.jetbrains.kotlin.android\" version \".*\"/id \"org.jetbrains.kotlin.android\" version \"1.9.24\"/" android/settings.gradle || true
          flutter clean
          flutter pub get
          dart run flutter_launcher_icons || echo "Icon skip"
      - name: Auto Build APK
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter build apk --release --dart-define=GROQ_API_KEY=$GROQ_KEY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-girl-pro-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
