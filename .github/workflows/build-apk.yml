name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.35.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          cache: true

      - name: Auto Fix - Android Folder + Kotlin + Icon
        run: |
          flutter create . --org com.aigirl.pro --project-name ai_girl_pro
          git checkout HEAD -- lib/ pubspec.yaml assets/ || true
          sed -i "s/id \"org.jetbrains.kotlin.android\" version \".*\"/id \"org.jetbrains.kotlin.android\" version \"2.1.0\"/" android/settings.gradle || true
          flutter clean
          flutter pub get
          echo "=== Icon Generate Kar Raha Hun - Tumhara Wala ==="
          dart run flutter_launcher_icons || flutter pub run flutter_launcher_icons || echo "Icon step skip - pubspec check karo"
          echo "=== Icon Check ==="
          ls -lh android/app/src/main/res/mipmap-*/ic_launcher.png || echo "Icon default rahega"

      - name: Auto Build APK with Secret Key
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          flutter build apk --release --dart-define=GROQ_API_KEY=$GROQ_KEY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-girl-pro-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
